<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saathi — Medication Behaviour Study</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #4A3E9C;
    --primary-light: #6557C4;
    --secondary: #EBE6FF;
    --white: #FEFEFE;
    --black: #2A2A2A;
    --bg: #F6F6F6;
    --border: rgba(74, 62, 156, 0.12);
    --shadow: 0 2px 16px rgba(74, 62, 156, 0.10);
    --shadow-hover: 0 8px 32px rgba(74, 62, 156, 0.18);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--black);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== SCREEN 1: SELECTION ===== */
  #screen-selection {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 0 60px;
  }

  .header {
    padding: 36px 48px 0;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .header-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--primary);
    letter-spacing: -0.5px;
  }

  .header-subtitle {
    font-size: 13px;
    font-weight: 400;
    color: #888;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  

  .selection-hero {
    padding: 40px 48px 40px;
    max-width: 680px;
  }

  .selection-hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 38px;
    line-height: 1.18;
    color: var(--black);
    margin-bottom: 14px;
    letter-spacing: -0.5px;
  }

  .selection-hero h1 em {
    color: var(--primary);
    font-style: italic;
  }

  .selection-hero p {
    font-size: 15px;
    color: #666;
    line-height: 1.65;
    font-weight: 400;
    max-width: 480px;
  }

  .persona-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 0 48px;
  }

  .persona-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    cursor: pointer;
    transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .persona-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent-color, var(--primary));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform var(--transition);
  }

  .persona-card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-3px);
    border-color: rgba(74, 62, 156, 0.22);
  }

  .persona-card:hover::before { transform: scaleX(1); }

  .card-archetype {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-color, var(--primary));
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .card-archetype::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-color, var(--primary));
    flex-shrink: 0;
  }

  .card-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 16px;
    flex-shrink: 0;
    background: var(--secondary);
  }

  .card-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .card-name {
    font-family: 'DM Serif Display', serif;
    font-size: 19px;
    color: var(--black);
    margin-bottom: 4px;
    letter-spacing: -0.2px;
  }

  .card-age {
    font-size: 13px;
    color: #999;
    font-weight: 400;
    margin-bottom: 14px;
  }

  .card-desc {
    font-size: 13.5px;
    color: #555;
    line-height: 1.55;
    flex: 1;
    margin-bottom: 22px;
  }

  .card-cta {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-color, var(--primary));
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.02em;
  }

  .card-cta svg { transition: transform var(--transition); }
  .persona-card:hover .card-cta svg { transform: translateX(4px); }

  .card-1 { --accent-color: #4A3E9C; }
  .card-2 { --accent-color: #2E8B57; }
  .card-3 { --accent-color: #1A6FA8; }
  .card-4 { --accent-color: #B8860B; }

  /* ===== SCREEN 2: CHAT ===== */
  #screen-chat {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  #screen-chat.active { display: flex; }

  .chat-header {
    background: var(--white);
    border-bottom: 1.5px solid var(--border);
    padding: 0 40px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .chat-back {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), border-color var(--transition);
    color: var(--black);
  }

  .chat-back:hover { background: var(--secondary); border-color: var(--primary); }

  .chat-persona-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--secondary);
    flex-shrink: 0;
  }

  .chat-persona-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .chat-persona-name {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    color: var(--black);
    line-height: 1;
    margin-bottom: 3px;
  }

  .chat-persona-archetype {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary);
  }

  .chat-header-right {
    font-size: 12px;
    color: #aaa;
    font-weight: 400;
  }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 36px 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .chat-body::-webkit-scrollbar { width: 5px; }
  .chat-body::-webkit-scrollbar-track { background: transparent; }
  .chat-body::-webkit-scrollbar-thumb { background: rgba(74,62,156,0.2); border-radius: 99px; }

  .msg {
    display: flex;
    gap: 12px;
    animation: msgIn 0.28s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-family: 'DM Serif Display', serif;
    margin-top: 2px;
    background: var(--secondary);
  }

  .msg-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .msg.user .msg-avatar {
    background: var(--primary);
    color: var(--white);
    font-weight: 600;
  }

  .msg-bubble {
    max-width: 60%;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.62;
    color: var(--black);
  }

  .msg.bot .msg-bubble {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-bottom-left-radius: 5px;
  }

  .msg.user .msg-bubble {
    background: var(--primary);
    color: var(--white);
    border-bottom-right-radius: 5px;
  }

  .msg-time {
    font-size: 11px;
    color: #bbb;
    margin-top: 5px;
    display: block;
  }

  .msg.user .msg-time { text-align: right; }

  .typing-indicator {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .typing-dots {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    border-bottom-left-radius: 5px;
    padding: 14px 18px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dots span {
    width: 7px; height: 7px;
    background: #ccc;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); background: #ccc; }
    30% { transform: translateY(-5px); background: var(--primary); }
  }

  .suggested-questions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 40px 16px;
    flex-shrink: 0;
  }

  .sq-label {
    width: 100%;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #aaa;
    margin-bottom: 4px;
  }

  .sq-btn {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    color: var(--primary);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background var(--transition), border-color var(--transition);
    font-weight: 500;
  }

  .sq-btn:hover { background: var(--secondary); border-color: var(--primary); }

  .chat-footer {
    background: var(--white);
    border-top: 1.5px solid var(--border);
    padding: 16px 40px 20px;
    flex-shrink: 0;
  }

  .chat-input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .chat-input {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--black);
    outline: none;
    resize: none;
    min-height: 46px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color var(--transition);
  }

  .chat-input:focus { border-color: var(--primary); }
  .chat-input::placeholder { color: #bbb; }

  .chat-send {
    width: 46px; height: 46px;
    background: var(--primary);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    transition: background var(--transition), transform var(--transition);
    flex-shrink: 0;
  }

  .chat-send:hover { background: var(--primary-light); transform: scale(1.04); }
  .chat-send:active { transform: scale(0.97); }
  .chat-send:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  .welcome-banner {
    background: var(--secondary);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    font-size: 14px;
    color: var(--primary);
    line-height: 1.6;
    border-left: 3px solid var(--primary);
    margin-bottom: 4px;
  }

  @media (max-width: 1100px) {
    .persona-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 700px) {
    .header, .selection-hero, .persona-grid { padding-left: 20px; padding-right: 20px; }
      .persona-grid { grid-template-columns: 1fr; }
    .chat-header, .chat-body, .chat-footer, .suggested-questions { padding-left: 20px; padding-right: 20px; }
    .msg-bubble { max-width: 82%; }
    .selection-hero h1 { font-size: 28px; }
    .api-input { width: 200px; }
  }
</style>
</head>
<body>

<!-- SCREEN 1: PERSONA SELECTION -->
<div id="screen-selection">
  <div class="header">
    <span class="header-logo">Saathi</span>
    <span class="header-subtitle">Medication Behaviour Research</span>
  </div>


</div>

<!-- SCREEN 2: CHAT -->
<div id="screen-chat">
  <div class="chat-header">
    <div class="chat-header-left">
      <button class="chat-back" onclick="goBack()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <div class="chat-persona-avatar" id="chat-avatar"></div>
      <div>
        <div class="chat-persona-name" id="chat-name"></div>
        <div class="chat-persona-archetype" id="chat-archetype"></div>
      </div>
    </div>
    <div class="chat-header-right">Saathi Research Tool</div>
  </div>

  <div class="chat-body" id="chat-body"></div>

  <div class="suggested-questions" id="suggested-questions"></div>

  <div class="chat-footer">
    <div class="chat-input-row">
      <textarea class="chat-input" id="chat-input" placeholder="Ask anything — type freely…" rows="1"></textarea>
      <button class="chat-send" id="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
</div>

  contents.push({ role: 'user', parts: [{ text: userMessage }] });

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: persona.system,
        contents: contents
      })
    });

    const data = await response.json();

    if (!response.ok) {
      if (response.status === 401 || response.status === 403) return "API key error on server. Check your Vercel environment variable.";
      if (response.status === 429) return "Rate limit reached. Please wait a moment and try again.";
      return "Something went wrong: " + (data.error || 'unknown error');
    }

    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    if (!text) return getFallback(personaKey);

    if (!conversationHistory[personaKey]) conversationHistory[personaKey] = [];
    conversationHistory[personaKey].push({ role: 'user', content: userMessage });
    conversationHistory[personaKey].push({ role: 'assistant', content: text });

    return text;

  } catch (err) {
    console.error('Error:', err);
    return "Connection error. Please try again.";
  }
}

function getFallback(personaKey) {
  const f = {
    shanta: "I'm not quite sure how to put that… could you ask me differently? I want to give you the right answer.",
    arnav:  "I would have to think about that. My son usually handles these things — I'm not always sure on my own.",
    meena:  "Let me think about that practically. It depends on the situation really.",
    suresh: "I manage most things on my own without much difficulty. I have a system that works."
  };
  return f[personaKey] || "I'm not sure about that right now.";
}

// ============================================================
// UI FUNCTIONS
// ============================================================
function openChat(personaKey) {


  currentPersonaKey = personaKey;
  const persona = personas[personaKey];

  document.getElementById('screen-selection').style.display = 'none';
  const chatScreen = document.getElementById('screen-chat');
  chatScreen.style.display = 'flex';

  // Set header
  const avatarEl = document.getElementById('chat-avatar');
  avatarEl.innerHTML = `<img src="${personaImages[personaKey]}" alt="${persona.name}" style="width:100%;height:100%;object-fit:cover;object-position:${personaImgPosition[personaKey]};">`;
  document.getElementById('chat-name').textContent = persona.name;
  document.getElementById('chat-archetype').textContent = persona.archetype;

  // Clear chat body
  const chatBody = document.getElementById('chat-body');
  chatBody.innerHTML = '';

  // Welcome message
  const banner = document.createElement('div');
  banner.className = 'welcome-banner';
  banner.textContent = persona.welcome;
  chatBody.appendChild(banner);

  // Suggested questions
  const sqContainer = document.getElementById('suggested-questions');
  sqContainer.innerHTML = '<div class="sq-label">Suggested questions</div>';
  suggestedQuestions.slice(0, 5).forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'sq-btn';
    btn.textContent = q;
    btn.onclick = () => {
      document.getElementById('chat-input').value = q;
      sendMessage();
    };
    sqContainer.appendChild(btn);
  });

  document.getElementById('chat-input').focus();
}

function goBack() {
  document.getElementById('screen-chat').style.display = 'none';
  document.getElementById('screen-selection').style.display = 'flex';
  currentPersonaKey = null;
}

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function appendMessage(text, role) {
  const chatBody = document.getElementById('chat-body');
  const persona = personas[currentPersonaKey];

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';

  if (role === 'bot') {
    avatar.innerHTML = `<img src="${personaImages[currentPersonaKey]}" alt="${persona.name}" style="object-position:${personaImgPosition[currentPersonaKey]};">`;
  } else {
    avatar.textContent = 'R';
    avatar.style.background = 'var(--primary)';
    avatar.style.color = 'white';
    avatar.style.fontSize = '13px';
    avatar.style.fontWeight = '600';
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const textSpan = document.createElement('span');
  textSpan.textContent = text;

  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = getTime();

  bubble.appendChild(textSpan);
  bubble.appendChild(time);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatBody.appendChild(msg);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function showTyping() {
  const chatBody = document.getElementById('chat-body');
  const typing = document.createElement('div');
  typing.className = 'typing-indicator';
  typing.id = 'typing-indicator';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.innerHTML = `<img src="${personaImages[currentPersonaKey]}" alt="" style="object-position:${personaImgPosition[currentPersonaKey]};">`;

  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  typing.appendChild(avatar);
  typing.appendChild(dots);
  chatBody.appendChild(typing);
  chatBody.scrollTop = chatBody.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !currentPersonaKey) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  appendMessage(text, 'user');
  showTyping();

  const reply = await getGeminiResponse(currentPersonaKey, text);
  hideTyping();
  appendMessage(reply, 'bot');

  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadApiKey();

  const input = document.getElementById('chat-input');
  input.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // api-key-input enter key handled inline in modal
});
</script>
